name: Release executables

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.1.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: gleam-lang/setup-gleam@v2
        with:
          gleam-version: 1.18.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build release executables
        run: |
          bun scripts/build-executable.mjs --target bun-darwin-arm64 --outfile dist/code-map-darwin-arm64
          bun scripts/build-executable.mjs --target bun-darwin-x64 --outfile dist/code-map-darwin-x64
          bun scripts/build-executable.mjs --target bun-linux-arm64 --outfile dist/code-map-linux-arm64
          bun scripts/build-executable.mjs --target bun-linux-x64 --outfile dist/code-map-linux-x64
          bun scripts/build-executable.mjs --target bun-windows-x64 --outfile dist/code-map-windows-x64.exe

      - name: Smoke-test Linux executable
        run: dist/code-map-linux-x64 --help

      - name: Generate checksums
        run: cd dist && sha256sum code-map-* > SHA256SUMS

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Publish release
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
