name: Release executables

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.1.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            outfile: dist/code-map
          - os: macos-latest
            outfile: dist/code-map
          - os: windows-latest
            outfile: dist/code-map.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # ratchet:pnpm/action-setup@v6
        with:
          version: 11.13.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # ratchet:erlef/setup-beam@v1.24.1
        with:
          gleam-version: 1.18.1
          otp-version: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native executable
        run: |
          pnpm build
          bun scripts/build-executable.mjs --outfile ${{ matrix.outfile }}

      - name: Smoke-test executable
        shell: bash
        run: |
          repo="$(mktemp -d)"
          git -C "$repo" init --quiet
          printf '%s\n' '---' 'function hello() {}' '---' '<p>Hello</p>' > "$repo/hello.astro"
          "${{ matrix.outfile }}" --root "$repo" find hello --json |
            grep -q '"total":1'

  release:
    needs: smoke
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # ratchet:pnpm/action-setup@v6
        with:
          version: 11.13.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # ratchet:erlef/setup-beam@v1.24.1
        with:
          gleam-version: 1.18.1
          otp-version: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build release executables
        run: |
          bun scripts/build-executable.mjs --target bun-darwin-arm64 --outfile dist/code-map-darwin-arm64
          bun scripts/build-executable.mjs --target bun-darwin-x64 --outfile dist/code-map-darwin-x64
          bun scripts/build-executable.mjs --target bun-linux-arm64 --outfile dist/code-map-linux-arm64
          bun scripts/build-executable.mjs --target bun-linux-x64 --outfile dist/code-map-linux-x64
          bun scripts/build-executable.mjs --target bun-windows-x64 --outfile dist/code-map-windows-x64.exe

      - name: Smoke-test Linux executable
        run: |
          repo="$(mktemp -d)"
          git -C "$repo" init --quiet
          printf '%s\n' '---' 'function hello() {}' '---' '<p>Hello</p>' > "$repo/hello.astro"
          dist/code-map-linux-x64 --root "$repo" find hello --json |
            grep -q '"total":1'

      - name: Generate checksums
        run: cd dist && sha256sum code-map-* > SHA256SUMS

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # ratchet:actions/attest@v4
        with:
          subject-path: dist/*

      - name: Publish release
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
